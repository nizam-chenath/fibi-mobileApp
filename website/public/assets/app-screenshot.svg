    <rect x="34" y="230" width="292" height="10" rx="6" />
    <rect x="34" y="252" width="220" height="10" rx="6" />
    <rect x="34" y="274" width="260" height="10" rx="6" />
  </g>

  <!-- chart -->
  <polyline points="44,360 84,320 124,360 164,300 204,340 244,310 284,330" fill="none" stroke="#58fff2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- bottom nav -->
  <rect x="34" y="660" width="292" height="48" rx="12" fill="#0b1720" />
  <circle cx="92" cy="684" r="10" fill="#74f1d8" />
  <circle cx="180" cy="684" r="10" fill="#7ae2b7" />
  <circle cx="268" cy="684" r="10" fill="#a1f7d9" />
</svg>
